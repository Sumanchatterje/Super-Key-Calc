
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator - Super Key</title>
    <meta name="description" content="Created a calculator which will calculate the total number of super keys.">
    <meta name="keywords" content="super key calculator, database, relational schema">
    <meta name="author" content="Suman Chatterjee">

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Super Key Calculator">
    <meta property="og:description" content="Author: Suman Chatterjee">
    <meta property="og:type" content="Web-App">
    <meta property="og:site_name" content="Super Key Calculator">

    <!-- LinkedIn Profile Link -->
    <link rel="author" href="https://www.linkedin.com/in/suman-chatterjee-7ab471230/">

    <!-- Favicon -->
    <link rel="icon" href="img.png" type="image/png">

    <!-- External CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <div class="form-box calculate">
        <form id="superKeyForm">
            <h1>CALCULATOR📱</h1>
            <div class="input-box">
                <input type="number"  id="num_attributes" min="0" placeholder="Number of Attributes" name="num_attributes" required oninput="generateAttributeInputs()"><br><br>
                <div id="attribute_inputs">

                </div>
            </div>

            <div class="input-box">
                <input type="number" id="num_candidate_keys" min="0" placeholder="Number of Candidate Keys" name="num_candidate_keys" required oninput="generateCandidateKeyInputs()"><br><br>
                <div id="candidate_key_inputs">

                </div>
            </div>

            <div class="input-box">
                <input type="number" id="num_fd" min="0" placeholder="Number of Functional Dependencies" name="num_fd" required oninput="generateFDInputs()"><br><br>
                <div id="fd_inputs">

                </div>
            </div>
            <!--<button id="theme-toggle" onclick="toggleTheme()">Toggle Mode</button>-->
            <button type="button" class="btn" onclick="handleSubmit()">Submit 🤞</button>
            <button style="margin-top: 2%" type="button" class="btn" onclick="clearFields()">Clear </button>

        </form>
    </div>
    <div class="form-box result">
        <h1>ALL SUPER KEYS 😎</h1>
        <div style="margin-top: 5%" id="output"></div>
    </div>
    <div class="toggle-box">
        <div class="toggle-panel toggle-left">
            <h1>Hello!(●'◡'●)</h1>
            <p>Enter your candidate keys or functional dependencies.😁</p>
        </div>
        <div class="toggle-panel toggle-right">
            <h1>Got it!</h1>
            <p>(〃￣︶￣)人(￣︶￣〃)</p>
            <button class="btn login-btn">Check Another?🤷‍♂️</button>
        </div>
    </div>
</div>

<!-- Link to external JS file -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="script.js"></script>
</body>
</html>
